name: Release

# Runs on every git tag `v*`. Publishes the root single package (tengence-geo-agent,
# which bundles the @tengence/* workspace packages) to npm. MCP Registry publishing
# (com.tengence/geo-agent) is done locally via HTTP domain auth — see scripts/ or
# AGENTS.md — because the Registry's GitHub OIDC flow only covers io.github.* namespaces.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write        # required for npm provenance / OIDC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Publish the root single package. NPM_TOKEN must be an Automation token
      # stored as a repo secret. Provenance is attached when the package is
      # published from a public GitHub repo.
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
