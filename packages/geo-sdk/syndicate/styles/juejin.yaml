platform: juejin
name: 掘金
api: cookie
status: ready
capabilities:
  multiArticle: false
  maxArticles: 1
  maxTitleLen: 40
  maxBodyLen: 15000
  tags: true
  cover: false
  draft: true
  schedule: false
rewrite:
  # 掘金是纯算法推荐流，标题与正文都需按技术社区调性改写
  strategy: both
  title:
    max: 40
    style: "技术向、可作搜索标题；问句或数字更吸睛"
    hooks:
      - "数字清单：『XX 怎么做？7 个步骤』"
      - "对比反差：『我为什么放弃了 X，改用 Y』"
      - "实战复盘：『上线 3 个月，我们的 GEO 涨了 N 倍』"
    forbidden: ["最", "第一", "震惊", "速速", "史上", "必看"]
  # 字面匹配（styleCheck 用 substring 判定），必须写具体块名/文案，不要写抽象占位
  removeBlocks:
    - "关于通智云"
    - "关于我们"
    - "立即行动"
    - "免费试用"
    - "免费预约"
    - "预约专家咨询"
    - "了解通智搜索"
    - "了解通智 GEO"
  # 正文禁用的营销短语（命中即 errors；来源：掘金《社区内容发布规范》第五条 广告内容）
  forbiddenPhrases:
    - "免费试用"
    - "免费预约"
    - "预约咨询"
    - "预约诊断"
    - "立即咨询"
    - "联系我们"
    - "扫码"
    - "加群"
    - "添加微信"
    - "关注公众号"
  keepBlocks: ["关键要点", "常见问题", "数据来源"]
  # 站外品牌链接控制（来源：掘金推荐规则「引流类文章」+ 2026-02-04 过度营销专项治理）
  # 原则：区分「编辑性延伸阅读」与「营销转化导流」——
  #   前者（指向本站已发布文章正文）允许，后者（首页/产品页/定价/注册/控制台/CTA 落地页）一律禁止。
  externalLinks:
    # -1 = 不限制条数（『相关阅读』与引用皆不限）；≥0 则为上限
    maxBrandLinks: -1
    brandDomainPatterns: ["tengence.com"]
    allowCitations: true
    # 允许保留的本站链接：必须是文章正文页（编辑性引用），其余路径一律 error
    brandLinkAllowedPatterns:
      - "tengence.com/blog/article/"
    # 禁止出现的转化/营销类路径或主机（命中即 error，即使数量未超上限）
    brandLinkDeniedPatterns:
      - "console."
      - "app."
      - "/pricing"
      - "/price"
      - "/signup"
      - "/register"
      - "/login"
      - "/demo"
      - "/contact"
      - "/trial"
      - "/product"
      - "/solution"
      - "/about"
    # 位置建议：集中在文末（warnings 提示，不拦截）
    brandLinkTailOnly: true
    note: "本站文章链接（/blog/article/）条数不限，建议集中在文末『相关阅读』；首页/产品/定价/注册/控制台等转化链接一律删除；第三方权威引用条数同样不限"
  body:
    minChars: 800
    maxChars: 15000
    firstPara: "一句话背景 + 本文解决什么问题，面向技术读者"
    style: "技术严谨、保留代码/表格/数据；步骤清晰、可复现"
    structure: ["背景与问题", "方案/步骤", "关键要点", "FAQ", "参考来源"]
  internalLinks:
    required: false
    note: "可保留指向官网原文的链接，但避免硬广"
  cta:
    required: false
    note: "掘金社区排斥硬广，文末轻量引导关注即可"
  cover:
    required: false
    note: "掘金自动取首图"
  tags:
    max: 5
    note: "技术标签（GEO、SEO、搜索、AI）；精准 3-5 个"
  checklist:
    - "标题 ≤40 字且技术向"
    - "无 forbidden 词"
    - "首段交代背景与解决的问题"
    - "保留代码块/表格/数据来源"
    - "删除品牌营销块与 CTA（removeBlocks / forbiddenPhrases 全清空）"
    - "本站链接仅限 /blog/article/ 文章页（条数不限，建议集中在文末）；转化链接（首页/产品/定价/注册/控制台）为 0"
    - "标签 3-5 个精准"
    - "人工改写痕迹充分（见 compliance.aigc），避免被判 AIGC"
  # 审核红线：来自掘金官方《如何使用掘金社区》小册
  #   §10「内容审核和推荐规则」/ §13《社区内容发布规范》(section 6844733795380232200)
  #   以及《稀土掘金关于近期违规行为专项治理的公告》(2026-02-04)
  compliance:
    source: "https://juejin.cn/book/6844733795329900551/section/6844733795380232200"
    hardRules:
      - id: "ad-content"
        clause: "第五条 发布广告内容"
        text: "广告类内容以推广、曝光、品牌宣传为目的……个人在其他平台的付费教程、视频教程、书籍推广等内容也属于此范围。"
        penalty: "一经发现，根据严重程度自见/删除处理，并对发布者进行警告、禁言等相关处理。"
        do: "删除一切品牌介绍、产品介绍、免费试用/预约咨询类 CTA。"
      - id: "promo-article"
        clause: "推荐规则 · 推广类文章"
        text: "包括招聘、广告、SEO、活动等推广内容……一经发现，立即删除，并对发布者给予处理。"
        penalty: "不推荐 + 删除"
        do: "去掉营销意图；以技术问题与技术方案为主线，不出现厂商软文结构。"
      - id: "drain-article"
        clause: "推荐规则 · 引流类文章"
        text: "文章含有加群或个人微信二维码、公众号二维码一律不推荐（仅允许用文字引导关注公众号）。"
        penalty: "一律不推荐"
        do: "禁止二维码、加群/微信/公众号引导，以及首页、产品页、定价、注册、控制台等转化型链接；指向本站文章正文的相关阅读链接条数不限。"
      - id: "over-marketing"
        clause: "2026-02-04 专项治理公告 · 过度营销与诱导互动"
        text: "通过文章、评论、沸点、外部链接等形式实施高频营销推广……在技术内容中夹带明显营销或推广信息。"
        penalty: "删除或限制违规内容展示 / 限制账号功能或降低推荐权重 / 封禁"
        do: "链接不能指向转化落点：相关阅读只放本站文章页，转化页一律删除；不留任何转化话术；条数不限，但不宜满篇堆砌。"
      - id: "aigc"
        clause: "社区内容发布规范 · 一、抄袭行为 情况 3"
        text: "利用 ChatGPT 等 AIGC 工具发布文章……人工智能生成的技术文章在掘金直接发布。"
        penalty: "全部不推荐，且都纳入笔记范围；参加活动永久取消资格并账号降权。"
        do: "必须人工化改写：加入具体数字/真实约束/取舍理由/踩坑经验，打破模板腔与绝对化表述。"
    aigc:
      - "用具体数字与边界条件替代泛化表述（如『45 天周期』『覆盖率 62%』而非『通常有效』）。"
      - "写出取舍与代价（为什么不做 X、什么情况下不该上 Y），AI 稿普遍缺这部分。"
      - "给出可复现的落地细节：字段名、计算口径、埋点位置、失败案例。"
      - "破掉整齐的排比与三段论：允许长短句交错、出现口语化的经验判断。"
      - "保留个人视角（『我们在 X 场景试过』『踩过的坑是』），不要通篇客观陈述。"
  notes: |
    - 技术教程结构：背景 → 方案/步骤 → 要点 → FAQ → 参考来源
    - 保留代码块、表格、数据来源以增强可信
    - 删除品牌营销块与一切 CTA（掘金社区排斥硬广，可触发第五条『发布广告内容』处罚）
    - 本站链接只保留指向文章正文的相关阅读（/blog/article/），**条数不限**，建议集中在文末；
      首页、产品页、定价、注册、控制台等转化链接一律删除
    - 第三方权威引用同样不限条数（『数据来源』块内或正文行内引用均可）
    - 发布走 cookie API：建草稿（draft）→ 后台确认后可发布
    - 原创首发（多平台同时发会掉权重）；参与官方征文有加权
    - AIGC 内容会被判不推荐并纳入笔记，改写必须留下人工痕迹（见 compliance.aigc）
