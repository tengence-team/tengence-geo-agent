platform: csdn
name: CSDN
api: cookie
status: ready
capabilities:
  multiArticle: false
  maxArticles: 1
  maxTitleLen: 100
  maxBodyLen: 20000
  tags: true
  cover: true
  draft: true
  schedule: false
  list: true
  delete: true
rewrite:
  # 改写策略：CSDN 主要管正文（标题可保留问答句式，检索友好）
  # source = 仅做轻量优化(博客源)；title = 主要改标题；body = 主要改正文；both = 二者都改
  strategy: body
  title:
    max: 100
    style: "技术向，含核心关键词；可用『XX 怎么做？』句式（CSDN 检索友好），避免标题党"
    # 合规违禁词（命中即不通过校验）
    forbidden: ["最", "第一", "震惊", "速速", "史上", "必看", "曝光", "引流", "免费领"]
  # 字面匹配（styleCheck 用 substring 判定），必须写具体块名/文案，不要写抽象占位
  removeBlocks:
    - "关于通智云"
    - "关于我们"
    - "立即行动"
    - "免费试用"
    - "免费预约"
    - "预约专家咨询"
    - "了解通智搜索"
    - "了解通智 GEO"
  # 正文禁用的营销短语（命中即 errors；来源：CSDN 审核规则「广告-诱导外链」）
  forbiddenPhrases:
    - "免费试用"
    - "免费预约"
    - "预约咨询"
    - "预约诊断"
    - "立即咨询"
    - "联系我们"
    - "扫码"
    - "加群"
    - "添加微信"
    - "关注公众号"
    - "商务合作"
    - "点击购买"
  keepBlocks: ["关键要点", "常见问题", "数据来源", "相关阅读"]
  # 站外品牌链接控制（来源：CSDN 审核「广告-诱导外链」）
  # 原则：区分「编辑性延伸阅读」与「营销转化导流」——
  #   前者（指向本站已发布文章正文）允许，后者（首页/产品页/定价/注册/控制台/CTA 落地页）一律禁止。
  externalLinks:
    # -1 = 不限制条数（『相关阅读』与引用皆不限）；≥0 则为上限
    maxBrandLinks: -1
    brandDomainPatterns: ["tengence.com"]
    allowCitations: true
    # 允许保留的本站链接：必须是文章正文页（编辑性引用），其余路径一律 error
    brandLinkAllowedPatterns:
      - "tengence.com/blog/article/"
    # 禁止出现的转化/营销类路径或主机（命中即 error，即使数量未超上限）
    brandLinkDeniedPatterns:
      - "console."
      - "app."
      - "/pricing"
      - "/price"
      - "/signup"
      - "/register"
      - "/login"
      - "/demo"
      - "/contact"
      - "/trial"
      - "/product"
      - "/solution"
      - "/about"
    # 位置建议：集中在文末（warnings 提示，不拦截）
    brandLinkTailOnly: true
    note: "本站文章链接（/blog/article/）条数不限，建议集中在文末『相关阅读』；首页/产品/定价/注册/控制台等转化链接一律删除；第三方权威引用条数同样不限"
  body:
    minChars: 800
    maxChars: 20000
    firstPara: "背景 + 问题 + 本文结构，技术读者可快速判断是否值得读"
    style: "技术严谨、保留代码/表格/数据；步骤清晰、可复现"
    structure: ["背景与问题", "方案/步骤", "关键要点", "FAQ", "参考来源"]
  cover:
    required: false
    note: "CSDN 自动取首图；若设封面须转存到 CSDN 自家 CDN（i-blog.csdnimg.cn），外链作封面无效"
  tags:
    max: 5
    note: "CSDN 标签为自由文本，逗号分隔；发布时强制 1~5 个（缺标签直接 400 请设置文章标签）"
  checklist:
    - "标题 ≤100 字且技术向，无 forbidden 词"
    - "首段交代背景与解决的问题"
    - "保留代码块/表格/数据来源"
    - "删除品牌营销块与 CTA（removeBlocks / forbiddenPhrases 全清空）"
    - "本站链接仅限 /blog/article/ 文章页；相关阅读与第三方引用条数不限，转化链接（首页/产品/定价/注册/控制台）为 0"
    - "标签 1-5 个精准"
  # 审核红线：来自 CSDN 创作中心审核规则（社区规范 / 反垃圾反广告）
  #   实测驳回文案：『广告-诱导外链』
  compliance:
    # status 枚举（来自 bizapi article/list 返回）：
    #   0=已发布公开  1=私密  2=草稿  3=待审核  4=审核中
    #   6=审核未通过(驳回)  7=审核中(提交后)
    statusCodes: "0=已发布公开 / 1=私密 / 2=草稿 / 3=待审核 / 4=审核中 / 6=审核未通过(驳回) / 7=审核中"
    auditReasonViaApi: false
    auditReasonNote: "CSDN 审核驳回原因只在创作者控制台 UI 展示，Aliyun 网关 API 只返回 status 码、不返回原因文案。排查须看 UI 或按正文特征推断。"
    hardRules:
      - id: "ad-drainage"
        clause: "广告-诱导外链"
        text: "文章含营销推广、站外引流（转化类外链、CTA 引导）会被判『广告-诱导外链』"
        penalty: "审核不通过（status=6），重发仍触发"
        do: "删除品牌营销块（关于通智云/关于我们）、立即行动 CTA；移除 console./contact/product 等转化外链；仅保留 /blog/article/ 文章页与第三方权威引用"
    coverNote: "封面图必须转存到 CSDN 自家 CDN（i-blog.csdnimg.cn）；直接用外链作封面无效。重发（is_new=0 + article_id）须回传 coverImages，否则封面被清空。"
  notes: |
    - api: cookie —— 非官方 OpenAPI。CSDN 未开放写作类公开接口，走的是创作中心自身的
      bizapi 网关（Cookie + 本地计算的 x-ca-* 签名），与掘金同性质。
    - 服务端不做 Markdown→HTML 转换：发布链路用 mdToCsdnHtml() 先转好 HTML
      再提交，否则详情页会渲染成一坨纯文本并丢失代码高亮。
    - 一步式发文（saveArticle 的 status 字段）：2=草稿 / 1=审核 / 0=发布，
      is_new=0 + article_id 即更新。没有掘金那种 create→update→publish 三步。
    - 发布即公开（status:0），故默认走草稿（asDraft=true），人工核对后再发布。
    - 改写要求见上方 rewrite：品牌块/CTA/转化外链必须剥离（CSDN 审核「广告-诱导外链」），否则驳回。
      发布前由 harness 按本 yaml 的 removeBlocks / forbiddenPhrases / externalLinks 规则剥离后再提交（掘金同构）。
    - 封面图须转存 CSDN CDN，重发须回传 coverImages。
    - 标题可用『XX 怎么做？』句式（检索友好），但避免标题党。
    - 技术教程结构；保留代码/表格/数据来源。
    - 文末可保留官网原文链接（本站 /blog/article/ 文章页，指向编辑性引用）。
