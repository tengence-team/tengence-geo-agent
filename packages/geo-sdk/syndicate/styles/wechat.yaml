platform: wechat
name: 微信公众号
api: official
status: ready
capabilities:
  multiArticle: true
  maxArticles: 8
  maxTitleLen: 64
  maxBodyLen: 20000
  tags: false
  cover: true
  draft: true
  schedule: false
rewrite:
  # 改写策略：本平台既要改标题也要改正文（标题最关键）。
  # source = 仅做轻量优化(博客源)；title = 主要改标题；body = 主要改正文；both = 二者都改
  strategy: both
  title:
    max: 64
    style: "利益点+悬念+数字；含核心关键词；忌营销夸张词"
    # 标题钩子模板：改写时按题材择一生成
    hooks:
      - "数字清单：『7 个步骤搞定企业 GEO』"
      - "痛点反问：『AI 搜不到你的品牌？先改这 3 处』"
      - "结论前置：『企业做 GEO，先改这 3 处就够』"
    # 合规违禁词（命中即不通过校验）
    forbidden: ["最", "第一", "100%", "绝对", "国家级", "唯一", "史无前例"]
  removeBlocks: ["相关阅读", "立即行动"]
  keepBlocks: ["<品牌简介块>", "关键要点", "常见问题", "数据来源"]
  body:
    minChars: 1200
    maxChars: 20000
    firstPara: "前 3 行直接给结论与价值，决定是否继续读"
    style: "口语化、短段落（2-4 句/段）、用 emoji 分隔；结论前置、分点展开、可引用数据/案例"
    # 正文结构模板（改写时按此骨架重组）
    structure: ["痛点开场", "核心结论/价值", "分点展开（含数据/案例）", "常见误区(FAQ)", "关注引导(CTA)"]
  internalLinks:
    required: false
    note: "图文内可用文字链，但避免大量站外跳转"
  # 转化钩子：公众号『关注断点』严重（实测整周零新增），必须保留
  cta:
    required: true
    text: "关注「通智云」并回复『GEO』领取《企业 AI 搜索优化清单》"
    note: "文末固定关注引导，是补『关注断点』的关键"
  cover:
    required: true
    note: "使用 DB featured_image；无图时提示需先配图"
  tags:
    max: 0
    note: "公众号图文无标签概念，忽略"
  # 验收清单（channel_check 对其中可自动项做硬校验，其余供人工核对）
  checklist:
    - "标题 ≤64 字且含核心关键词"
    - "标题无 forbidden 违禁词"
    - "首段前 3 行给出结论/价值"
    - "段落短（≤4 句），有 emoji 或分隔"
    - "保留<品牌简介块>与关注引导(CTA)"
    - "删除『相关阅读/立即行动』等站外干扰块"
    - "封面图已配置"
  notes: |
    - 一次最多 8 篇图文合并一条消息，第 1 篇为头条（keepOrder=true 保持传入顺序）
    - 正文用短段落（2-4 句/段），适度使用 emoji 分隔
    - 文末保留"<品牌简介块>"（如"关于我们"）并引导关注
    - 链接在图文内为可点击文字链；删除站外无关键作用的外链
    - 发布流程：同步草稿箱 → 后台预览确认 → 手动群发（不要直接群发）
    - 实测数据：推荐流量占大头（09-25 推荐 71/总 89），发布后 60 分钟内组织点赞+在看+转发可点燃推荐
